[Service]
# EnvironmentFile values override systemd's Environment= assignments. Put the
# operational lifetime directly on ExecStart so a stale value in the secret
# file cannot silently shorten the warm-runtime window.
ExecStart=
ExecStart=/usr/bin/env IDLE_RUNTIME_SECONDS=86400 /usr/bin/node /srv/aialra/apps/codexapp-official-web-host/current/apps/host/dist/main.js
