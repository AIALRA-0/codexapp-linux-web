server {
    listen 80;
    listen [::]:80;
    server_name codexapp.aialra.online;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    include /srv/aialra/config/nginx/snippets/aialra-hsts.conf;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name codexapp.aialra.online;

    ssl_certificate /etc/letsencrypt/live/codexapp.aialra.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/codexapp.aialra.online/privkey.pem;

    include /srv/aialra/config/nginx/snippets/aialra-auth-endpoints.conf;
    include /srv/aialra/config/nginx/snippets/aialra-auth-protect.conf;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
    }

    location / {
        include /srv/aialra/config/nginx/snippets/aialra-auth-identity-headers.conf;
        include /srv/aialra/config/nginx/snippets/codexapp-official-proxy-secret.conf;
        client_max_body_size 100m;
        proxy_pass http://127.0.0.1:13014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        # Buffer ordinary HTML and immutable official assets efficiently. Nginx
        # switches to the upgraded WebSocket tunnel after a 101 response, so
        # bridge frames still travel without HTTP response buffering.
        proxy_buffering on;
        proxy_request_buffering off;
    }
}
