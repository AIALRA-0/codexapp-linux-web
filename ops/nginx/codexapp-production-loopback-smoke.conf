server {
    listen 127.0.0.1:13018;
    server_name localhost;

    location ^~ /assets/ {
        proxy_set_header X-Aialra-Authenticated 1;
        proxy_set_header X-Aialra-Sub __CODEXAPP_SMOKE_SUBJECT__;
        proxy_set_header X-Aialra-User production-ui-smoke;
        proxy_set_header X-Aialra-Email production-ui-smoke@example.invalid;
        proxy_set_header X-Aialra-Groups "aialra:access:codexapp,aialra:role:developer";
        include /srv/aialra/config/nginx/snippets/codexapp-official-proxy-secret.conf;

        proxy_pass http://127.0.0.1:13017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        gzip on;
        gzip_comp_level 5;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_vary on;
        gzip_types application/javascript application/json image/svg+xml text/css text/javascript;
    }

    location / {
        proxy_set_header X-Aialra-Authenticated 1;
        proxy_set_header X-Aialra-Sub __CODEXAPP_SMOKE_SUBJECT__;
        proxy_set_header X-Aialra-User production-ui-smoke;
        proxy_set_header X-Aialra-Email production-ui-smoke@example.invalid;
        proxy_set_header X-Aialra-Groups "aialra:access:codexapp,aialra:role:developer";
        include /srv/aialra/config/nginx/snippets/codexapp-official-proxy-secret.conf;

        proxy_pass http://127.0.0.1:13017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering on;
        proxy_request_buffering off;
    }
}
