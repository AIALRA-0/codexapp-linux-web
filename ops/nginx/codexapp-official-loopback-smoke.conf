server {
    listen 127.0.0.1:13016;
    server_name localhost;

    location / {
        proxy_set_header X-Aialra-Authenticated 1;
        proxy_set_header X-Aialra-Sub official-ui-smoke-subject;
        proxy_set_header X-Aialra-User official-ui-smoke;
        proxy_set_header X-Aialra-Email official-ui-smoke@example.invalid;
        proxy_set_header X-Aialra-Groups "aialra:access:codexapp,aialra:role:developer";
        include /srv/aialra/config/nginx/snippets/codexapp-official-proxy-secret.conf;

        proxy_pass http://127.0.0.1:13014;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
